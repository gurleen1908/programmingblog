{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In | Programming Blog</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5,
                    #7c3aed
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           AUTH CARD
        ===================================================== */

        .auth-card {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);

            animation:
                cardAppear 0.5s ease;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            color: #2563eb;

            margin-bottom: 8px;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 15px;

            margin-top: 8px;

            margin-bottom: 30px;

            line-height: 1.6;
        }


        /* =====================================================
           FORM LABEL
        ===================================================== */

        .form-label {

            font-weight: 600;

            color: #202338;

            margin-bottom: 7px;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .form-control {

            width: 100%;

            padding: 13px 14px;

            border-radius: 12px;

            border: 1px solid #d9dee8;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }


        .form-control:hover {

            border-color: #94a3b8;
        }


        .form-control:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37, 99, 235, 0.12);

            transform:
                translateY(-1px);
        }


        /* =====================================================
           VALID / INVALID
        ===================================================== */

        .form-control.valid {

            border-color: #16a34a;
        }


        .form-control.invalid {

            border-color: #dc2626;

            box-shadow:
                0 0 0 3px
                rgba(220, 38, 38, 0.08);
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .btn-login {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            margin-top: 10px;

            cursor: pointer;

            transition: all 0.25s ease;
        }


        .btn-login:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(37, 99, 235, 0.25);
        }


        .btn-login:active {

            transform:
                scale(0.98);
        }


        .btn-login:disabled {

            opacity: 0.75;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =====================================================
           LOADING SPINNER
        ===================================================== */

        .spinner {

            display: inline-block;

            width: 16px;

            height: 16px;

            border: 2px solid
                rgba(255, 255, 255, 0.4);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin 0.7s linear infinite;

            vertical-align: middle;

            margin-right: 7px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           REGISTER LINK
        ===================================================== */

        .register-link {

            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 14px;
        }


        .register-link a {

            color: #2563eb;

            font-weight: 700;

            text-decoration: none;
        }


        .register-link a:hover {

            color: #174ea6;

            text-decoration: underline;
        }


        /* =====================================================
           DJANGO ALERT
        ===================================================== */

        .alert {

            border-radius: 12px;

            border: none;

            margin-bottom: 20px;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =====================================================
           ALERT CLOSE
        ===================================================== */

        .message-alert {

            position: relative;

            padding-right: 40px;
        }


        .close-alert {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            font-size: 20px;

            color: inherit;

            opacity: 0.6;

            cursor: pointer;
        }


        .close-alert:hover {

            opacity: 1;
        }


        /* =====================================================
           MOBILE RESPONSIVE
        ===================================================== */

        @media (max-width: 576px) {

            body {

                padding: 15px;
            }


            .auth-card {

                max-width: 100%;

                padding: 30px 22px;

                border-radius: 20px;
            }


            .logo {

                font-size: 26px;
            }


            .subtitle {

                font-size: 14px;

                margin-bottom: 25px;
            }


            .form-control {

                padding: 12px;

                font-size: 14px;
            }


            .btn-login {

                padding: 12px;

                font-size: 14px;
            }

        }


        /* =====================================================
           VERY SMALL MOBILE
        ===================================================== */

        @media (max-width: 360px) {

            body {

                padding: 10px;
            }


            .auth-card {

                padding: 25px 17px;

                border-radius: 18px;
            }


            .logo {

                font-size: 23px;
            }


            .subtitle {

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     LOGIN CARD
===================================================== -->

<div class="auth-card">


    <!-- ================= LOGO ================= -->

    <div class="logo">

        💻 Programming Blog

    </div>


    <!-- ================= SUBTITLE ================= -->

    <p class="subtitle">

        Welcome back! Sign in to continue 👋

    </p>


    <!-- =================================================
         DJANGO MESSAGES
    ================================================= -->

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert alert-danger message-alert"
                role="alert"
            >

                {{ message }}


                <button
                    type="button"
                    class="close-alert"
                    onclick="this.parentElement.remove()"
                    aria-label="Close"
                >

                    ×

                </button>

            </div>

        {% endfor %}

    {% endif %}


    <!-- =================================================
         LOGIN FORM
    ================================================= -->

    <form
        method="POST"
        action="{% url 'login' %}"
        id="loginForm"
    >

        {% csrf_token %}


        <!-- ================= USERNAME ================= -->

        <div class="mb-3">

            <label
                for="username"
                class="form-label"
            >

                Username

            </label>


            <input
                type="text"
                name="username"
                id="username"
                class="form-control"
                placeholder="Enter username"
                autocomplete="username"
                minlength="3"
                required
            >

        </div>


        <!-- ================= PASSWORD ================= -->

        <div class="mb-3">

            <label
                for="password"
                class="form-label"
            >

                Password

            </label>


            <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                placeholder="Enter password"
                autocomplete="current-password"
                minlength="6"
                required
            >

        </div>


        <!-- =================================================
             LOGIN BUTTON
        ================================================= -->

        <button
            type="submit"
            class="btn-login"
            id="loginButton"
        >

            <span id="buttonText">

                Sign In 🚀

            </span>

        </button>


    </form>


    <!-- =================================================
         REGISTER
    ================================================= -->

    <div class="register-link">

        Don't have an account?

        <a href="{% url 'register' %}">

            Create Account

        </a>

    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const form =
            document.getElementById(
                "loginForm"
            );


        const username =
            document.getElementById(
                "username"
            );


        const password =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const buttonText =
            document.getElementById(
                "buttonText"
            );


        /* =================================================
           LIVE VALIDATION
        ================================================= */

        const inputs =
            form.querySelectorAll(
                "input"
            );


        inputs.forEach(
            function (input) {

                input.addEventListener(
                    "input",
                    function () {

                        if (
                            this.checkValidity()
                        ) {

                            this.classList.remove(
                                "invalid"
                            );

                            this.classList.add(
                                "valid"
                            );

                        } else {

                            this.classList.remove(
                                "valid"
                            );

                            this.classList.add(
                                "invalid"
                            );

                        }

                    }
                );

            }
        );


        /* =================================================
           FORM SUBMIT
        ================================================= */

        form.addEventListener(
            "submit",
            function (event) {


                if (
                    !form.checkValidity()
                ) {

                    event.preventDefault();

                    form.reportValidity();

                    return;
                }


                /* Prevent double click */

                loginButton.disabled =
                    true;


                buttonText.innerHTML =
                    '<span class="spinner"></span> Signing In...';

            }
        );


        /* =================================================
           AUTO HIDE ALERTS
        ================================================= */

        const alerts =
            document.querySelectorAll(
                ".message-alert"
            );


        alerts.forEach(
            function (alert) {

                setTimeout(
                    function () {

                        alert.style.opacity =
                            "0";

                        alert.style.transform =
                            "translateY(-8px)";

                        alert.style.transition =
                            "0.4s ease";


                        setTimeout(
                            function () {

                                alert.remove();

                            },
                            400
                        );

                    },
                    5000
                );

            }
        );

    }
);

</script>


</body>

</html>
